<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfredo Storage Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay active" id="login-overlay">
        <div class="login-box">
            <div class="logo-icon" style="margin: 0 auto 20px auto;">A</div>
            <h2 style="text-align: center; margin-bottom: 24px;">Alfredo Storage</h2>
            <form id="login-form">
                <input type="text" id="login-user" placeholder="Usuário" required autocomplete="username">
                <input type="password" id="login-pass" placeholder="Senha" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Entrar</button>
            </form>
            <p id="login-error" style="color: var(--danger-color); text-align: center; margin-top: 12px; font-size: 14px; display: none;"></p>
        </div>
    </div>

    <div class="app-container" id="app-container" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">A</div>
                <h2>Alfredo</h2>
            </div>
            
            <nav class="main-nav">
                <a href="#" class="nav-item active" id="nav-home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Meus Arquivos
                </a>
            </nav>

            <div class="storage-info">
                <p>Disco Principal (500GB)</p>
                <div class="progress-bar"><div class="progress-fill" style="width: 45%;"></div></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header / Topbar -->
            <header class="topbar">
                <div class="breadcrumb" id="breadcrumb">
                    <!-- Preenchido via JS -->
                </div>
                
                <div class="actions">
                    <button class="btn btn-secondary" id="btn-new-folder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                        Nova Pasta
                    </button>
                    <label for="file-upload" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Upload
                    </label>
                    <input type="file" id="file-upload" style="display: none;" multiple>
                </div>
            </header>

            <!-- File Grid -->
            <div class="file-area" id="file-area">
                <!-- Arquivos preenchidos via JS -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modal-overlay"></div>
    
    <!-- Modal: Nova Pasta -->
    <div class="modal" id="modal-new-folder">
        <h3>Criar Nova Pasta</h3>
        <input type="text" id="input-folder-name" placeholder="Nome da pasta..." autocomplete="off">
        <div class="modal-actions">
            <button class="btn btn-secondary modal-close">Cancelar</button>
            <button class="btn btn-primary" id="btn-confirm-folder">Criar</button>
        </div>
    </div>

    <!-- Modal: Renomear -->
    <div class="modal" id="modal-rename">
        <h3>Renomear Item</h3>
        <input type="text" id="input-rename" placeholder="Novo nome..." autocomplete="off">
        <div class="modal-actions">
            <button class="btn btn-secondary modal-close">Cancelar</button>
            <button class="btn btn-primary" id="btn-confirm-rename">Renomear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
